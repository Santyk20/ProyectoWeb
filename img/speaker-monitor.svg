<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 240" width="110" height="240">
  <defs>
    <!-- Gradiente del gabinete de madera negra / acabado mate del parlante -->
    <linearGradient id="towerWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="50%" stop-color="#18181a" />
      <stop offset="100%" stop-color="#0d0d0f" />
    </linearGradient>

    <!-- Gradiente de los conos de los woofers -->
    <radialGradient id="coneRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#555" />
      <stop offset="55%" stop-color="#2a2a2c" />
      <stop offset="100%" stop-color="#141416" />
    </radialGradient>

    <!-- Bisel metálico de los drivers -->
    <linearGradient id="bezelRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444" />
      <stop offset="50%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#3a3a3c" />
    </linearGradient>
  </defs>

  <!-- Gabinete del parlante torre tipo AudioCord de la foto -->
  <rect x="6" y="6" width="98" height="228" rx="6" fill="url(#towerWood)" stroke="#09090b" stroke-width="3"/>
  <rect x="9" y="9" width="92" height="222" rx="4" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Tornillos de montaje del gabinete -->
  <circle cx="12" cy="12" r="1.5" fill="#888"/>
  <circle cx="98" cy="12" r="1.5" fill="#888"/>
  <circle cx="12" cy="228" r="1.5" fill="#888"/>
  <circle cx="98" cy="228" r="1.5" fill="#888"/>

  <!-- 1. Tweeter de cúpula de seda (arriba) -->
  <circle cx="55" cy="38" r="20" fill="#18181a" stroke="url(#bezelRing)" stroke-width="2"/>
  <circle cx="55" cy="38" r="11" fill="url(#coneRadial)" stroke="#111" stroke-width="1"/>
  <circle cx="55" cy="38" r="4.5" fill="#777"/>
  <!-- Tornillitos del tweeter -->
  <circle cx="43" cy="26" r="1" fill="#666"/>
  <circle cx="67" cy="26" r="1" fill="#666"/>
  <circle cx="43" cy="50" r="1" fill="#666"/>
  <circle cx="67" cy="50" r="1" fill="#666"/>

  <!-- 2. Rango Medio (Midrange Driver) con ojiva de dispersión -->
  <circle cx="55" cy="85" r="26" fill="#18181a" stroke="url(#bezelRing)" stroke-width="2.5"/>
  <circle cx="55" cy="85" r="20" fill="url(#coneRadial)" stroke="#151517" stroke-width="1.5"/>
  <ellipse cx="55" cy="85" rx="7" ry="9" fill="#111" stroke="#333" stroke-width="0.8"/>
  <circle cx="55" cy="85" r="3" fill="#666"/>

  <!-- 3. Woofer 1 (Graves superior) -->
  <circle cx="55" cy="140" r="28" fill="#18181a" stroke="url(#bezelRing)" stroke-width="2.5"/>
  <circle cx="55" cy="140" r="22" fill="url(#coneRadial)" stroke="#151517" stroke-width="1.5"/>
  <circle cx="55" cy="140" r="10" fill="#111" stroke="#222" stroke-width="1"/>

  <!-- 4. Woofer 2 (Graves inferior) -->
  <circle cx="55" cy="195" r="28" fill="#18181a" stroke="url(#bezelRing)" stroke-width="2.5"/>
  <circle cx="55" cy="195" r="22" fill="url(#coneRadial)" stroke="#151517" stroke-width="1.5"/>
  <circle cx="55" cy="195" r="10" fill="#111" stroke="#222" stroke-width="1"/>

  <!-- Logo tipográfico sutil de AudioCord en la base -->
  <text x="55" y="222" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#777" text-anchor="middle" letter-spacing="0.5">AudioCord</text>
  
  <!-- Patitas de desacople en la base -->
  <rect x="18" y="234" width="10" height="4" rx="1" fill="#111"/>
  <rect x="82" y="234" width="10" height="4" rx="1" fill="#111"/>
</svg>
